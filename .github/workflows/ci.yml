name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Byte-compile sources and tests
        run: python -m compileall -q src tests

      - name: Check for syntax errors and undefined names
        run: ruff check --select E9,F63,F7,F82 src tests

      - name: Collect tests
        run: pytest --collect-only -q

      - name: Run offline smoke tests
        run: pytest tests/test_smoke.py -q
