[project]
name = "mailroom-agent"
version = "0.2.0"
description = "A human-in-the-loop email triage and reply agent built with LangGraph"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-google-genai>=1.0.0",
    "langgraph>=1.0.0",
    "langsmith[pytest]>=0.4.37",
    "pandas",
    "matplotlib",
    "google-api-python-client>=2.128.0",
    "google-auth-oauthlib",
    "google-auth-httplib2",
    "python-dotenv",
    "html2text",
    "rich",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "langgraph-cli[inmem]>=0.4.0",
    "mypy>=1.11.1",
    "nbconvert",
    "nbformat",
    "pyppeteer",
    "pytest",
    "pytest-xdist",
    "ruff>=0.6.1",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mailroom = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "D417",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP", "T201"]
"notebooks/*" = ["D", "UP", "T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"
